name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        sqlalchemy: ["2.0", "latest"]
        pytest: ["latest"]
        include:
          # the oldest supported pytest
          - python-version: "3.10"
            sqlalchemy: "2.0"
            pytest: "8.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Pin SQLAlchemy to the 2.0 series
        if: matrix.sqlalchemy == '2.0'
        run: uv pip install "sqlalchemy==2.0.*"
      - name: Pin pytest to the oldest supported series
        if: matrix.pytest == '8.0'
        run: uv pip install "pytest==8.0.*"
      # coverage run (not --cov) so the module-level lines of the entry-point plugin count
      - run: uv run --no-sync coverage run -m pytest
      - run: uv run --no-sync coverage report

  # The missing-index check needs a real server. 14 and 15 cover the "too old"
  # notice; 16, 17 and 18 run the check itself. Each run exercises two
  # drivers: pg8000 (sync) and asyncpg (tests/test_index_check_async.py).
  # psycopg and psycopg2 are LGPL and not allowed as dependencies here, so
  # they are not part of the matrix. One more run on 16 uses the oldest
  # supported SQLAlchemy, which the asyncpg path depends on (run_async() on
  # adapted connections).
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17", "18"]
        sqlalchemy: ["latest"]
        include:
          - postgres: "16"
            sqlalchemy: "2.0"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      QUERYGUARD_PG_URL: postgresql+pg8000://postgres:pg@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Pin SQLAlchemy to the 2.0 series
        if: matrix.sqlalchemy == '2.0'
        run: uv pip install "sqlalchemy==2.0.*"
      - run: uv run --no-sync coverage run -m pytest -rs
      - run: uv run --no-sync coverage report
