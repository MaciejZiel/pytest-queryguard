[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pytest-queryguard"
dynamic = ["version"]
description = "Detect N+1 queries and enforce query budgets for SQLAlchemy 2 in pytest."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Maciej Zieliński" }]
keywords = [
    "pytest",
    "sqlalchemy",
    "n+1",
    "n-plus-one",
    "query-budget",
    "orm",
    "postgresql",
    "missing-index",
    "testing",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["pytest>=8", "sqlalchemy>=2.0"]

[project.urls]
Homepage = "https://github.com/MaciejZiel/pytest-queryguard"
Repository = "https://github.com/MaciejZiel/pytest-queryguard"
Changelog = "https://github.com/MaciejZiel/pytest-queryguard/blob/main/CHANGELOG.md"
Issues = "https://github.com/MaciejZiel/pytest-queryguard/issues"

[project.entry-points.pytest11]
queryguard = "pytest_queryguard.plugin"

[dependency-groups]
dev = [
    "aiosqlite",
    # Async PostgreSQL tests (Apache-2.0; async-timeout, Apache-2.0, below 3.11).
    "asyncpg>=0.31",
    "coverage[toml]",
    "fastapi",
    "httpx>=0.28,<0.29",
    "mypy",
    # PostgreSQL tests (BSD-3-Clause); psycopg and psycopg2 are LGPL.
    "pg8000>=1.31.5",
    "ruff",
    # SQLAlchemy 2.1 no longer installs greenlet, which the async tests need.
    "sqlalchemy[asyncio]",
]

[tool.hatch.version]
path = "src/pytest_queryguard/__init__.py"

# An allowlist, so CI config, context7.json and any untracked local files stay
# out of the sdist. llms.txt is documentation and ships with it.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs",
    "3rdparty_licenses.md",
    "CHANGELOG.md",
    "LICENSE",
    "llms.txt",
    "README.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_queryguard"]

[tool.uv]
exclude-newer = "2026-09-27T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[tool.coverage.run]
source = ["pytest_queryguard"]

[tool.coverage.report]
fail_under = 90
show_missing = true
